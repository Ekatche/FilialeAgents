services:
  # API Backend (FastAPI)
  - type: web
    name: filialeagents-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    region: frankfurt  # EU region (ou oregon pour US)
    plan: starter  # Changez selon vos besoins (starter, standard, pro)
    branch: main
    healthCheckPath: /health/live  # Endpoint ultra-léger (0 overhead)
    envVars:
      # Environment
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

      # Database (Supabase)
      - key: DATABASE_URL
        sync: false  # À configurer manuellement dans Render Dashboard
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 10
      - key: DB_POOL_TIMEOUT
        value: 30
      - key: DB_POOL_RECYCLE
        value: 3600

      # API Keys (à configurer dans Render Dashboard)
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # HubSpot OAuth (à configurer si utilisé)
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_REDIRECT_URI
        value: https://filialeagents-api.onrender.com/auth/hubspot/callback

      # JWT Security
      - key: JWT_SECRET_KEY
        generateValue: true  # Render génère automatiquement une clé sécurisée
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # API Configuration
      - key: API_PORT
        value: 8012
      - key: API_HOST
        value: 0.0.0.0
      - key: MAX_EXTRACTION_TIME
        value: 300
      - key: MAX_SUBSIDIARIES
        value: 50
      - key: WS_HEARTBEAT_INTERVAL
        value: 30
      - key: WS_CONNECTION_TIMEOUT
        value: 300

  # Frontend (Next.js)
  - type: web
    name: filialeagents-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: frankfurt  # Même région que l'API
    plan: starter
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://filialeagents-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://filialeagents-api.onrender.com
