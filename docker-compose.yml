services:
  # API Backend
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: openai-agents-api
    ports:
      - "8012:8012"  # Port 8012 pour l'API
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-test}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - API_PORT=8012
      - API_HOST=0.0.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-filialeagents}
    volumes:
      - ./api/logs:/app/logs
    networks:
      - openai-agents-network
    restart: unless-stopped
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openai-agents-frontend
    ports:
      - "3002:3001"  # Port 3002 pour le frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8012
      - NEXT_PUBLIC_WS_URL=ws://localhost:8012
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - openai-agents-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: openai-agents-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-filialeagents}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openai-agents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Interface d'administration PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openai-agents-pgadmin
    ports:
      - "5050:80"  # Port 5050 pour pgAdmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@filialeagents.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - openai-agents-network
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  openai-agents-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local